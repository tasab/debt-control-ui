<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: під нижню панель навігації треба знати висоту
         «шторки» iPhone, а без цього env(safe-area-inset-*) завжди нуль.
         Масштаб не обмежуємо — заборона зуму ламає доступність. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Колір системної смуги збігається з фоном шапки в кожній темі, інакше
         над додатком висить біла (чи чорна) стрічка чужого кольору. -->
    <meta name="theme-color" content="#f7f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14161f" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Debt Control" />
    <meta name="format-detection" content="telephone=no" />
    <title>Debt Control</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
